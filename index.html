<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Gallery Test 1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 40px 20px;
        }
        .gallery-card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .image-container {
            width: 100%;
            height: 350px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #eee;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }
        .swap-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .swap-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="gallery-card">
        <h1>Dynamic Image Gallery (Auto 3s Loop)</h1>
        
        <div class="image-container">
            <img id="galleryImage" src="https://picsum.photos/id/1018/800/600" alt="Gallery Image">
        </div>

        <button class="swap-btn" onclick="swapImage()">Next Image</button>
    </div>

    <script>
        // Array of images to loop through continuously
        const images = [
            "https://picsum.photos/id/1018/800/600",
            "https://picsum.photos/id/1015/800/600",
            "https://picsum.photos/id/1019/800/600"
        ];
        
        let currentIndex = 0;

        function swapImage() {
            const imgElement = document.getElementById("galleryImage");
            
            // Increment index and loop back to 0 when reaching the end of the array
            currentIndex = (currentIndex + 1) % images.length;
            
            // Smooth fade transition effect
            imgElement.style.opacity = 0;
            setTimeout(() => {
                imgElement.src = images[currentIndex];
                imgElement.style.opacity = 1;
            }, 150);
        }

        // Automatically call swapImage every 3 seconds (3000 milliseconds)
        setInterval(swapImage, 3000);
    </script>

</body>
</html>
