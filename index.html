<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Proxmox Docker Site</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 80px 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        h1 { color: #e67e22; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1rem; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Proxmox & Docker!</h1>
        <p>This simple static website was built locally, pushed to GitHub, built via containers, and deployed seamlessly onto your Proxmox server.</p>
        <div class="badge">Status: Online & Running 🚀</div>
    </div>
</body>
</html>
